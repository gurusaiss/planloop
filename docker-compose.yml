services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /repo/apps/server/data/app.db
      FILE_TOOL_ROOT: /repo/apps/server/data/files
      # Required — see .env.example for how to generate one. Compose will
      # refuse to start the container without this set (no insecure default).
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set — see .env.example}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - server-data:/repo/apps/server/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
